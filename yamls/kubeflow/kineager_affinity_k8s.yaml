# KinEAGER PDBbind-v2020 affinity training - Kubeflow PyTorchJob, one GPU per pod.
#
# Apply with:   kubectl apply -f yamls/kubeflow/kineager_affinity_k8s.yaml
#
# Relationship to the xtrimofold3 reference
# (xtrimofold3-affinity-plm/yamls/kubeflow/xf3_pl_multitask_k8s.yaml): that file is
# an argoproj.io/v1alpha1 Workflow which creates this same PyTorchJob as a
# `resource:` template, embedding the manifest as a string and parameterising it
# through {{inputs.parameters.*}}. This file is the bare PyTorchJob instead, so it
# is directly kubectl-apply-able and needs no Argo controller. If your cluster
# drives training through Argo, wrap this spec the same way the reference does.
#
# The pod spec below is written ONCE on the Master (anchor &pytorch-template) and
# aliased by the Worker, so the two replicas can never drift apart; they differ
# only in `replicas`.
#
# Every <REPLACE_ME ...> must be filled in before applying - none of them is a
# real image, path or hardware size for this project. They are deliberately not
# valid Kubernetes quantities/replica counts, so an unedited apply fails loudly
# instead of silently landing on the wrong hardware.
#
# The env block below is the run's configuration surface. CATA_PROFILE selects
# the path profile in path_config.py (the launcher also defaults it to "k8s");
# without it the trainer would fall back to the platform default profile and
# silently read the wrong CSV, run and backbone paths.
#
# USER is the other value that must not be left unset, for the same reason: it
# is what scopes the run's WRITE paths. path_config.py expands ${USER} in the k8s
# profile's runs_dir / weights_dir / train_data_dir, and bin/train/kineager_k8s.sh
# now refuses to start when it is unset. A pod sets neither USER nor USERNAME, so
# without this entry the paths would fall back to the SHARED
# /pfs_beijing/kineager/kineager_runs, where two concurrent users' per-epoch
# preds_epoch*/labels_epoch*.npy overwrite each other.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: kineager-affinity
  namespace: default
spec:
  runPolicy:
    # None = keep the pods after the job finishes so `kubectl logs` still works
    # (the reference uses `Running` plus ttlSecondsAfterFinished: 6000).
    cleanPodPolicy: None
    # Seconds after the job finishes before the PyTorchJob object itself is
    # deleted. This TTL is what stops a re-apply from silently launching
    # nothing: while the finished job object still exists, `kubectl apply` of
    # this unchanged file reports `unchanged`, the operator sees a successful
    # apply, and no new run starts. To start a run before the TTL fires, first
    # `kubectl delete pytorchjob kineager-affinity`.
    ttlSecondsAfterFinished: 6000
  # INVARIANT: NNODES (see the env block) == Master.replicas + Worker.replicas.
  # bin/train/kineager_k8s.sh validates NODE_RANK < NNODES and fails fast if the
  # two disagree.
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      # OnFailure as in the reference; use Never if you would rather fail fast
      # than let a rank restart into a rendezvous the other ranks already left.
      restartPolicy: OnFailure
      template: &pytorch-template
        metadata:
          annotations:
            # No service-mesh sidecar on the NCCL data path.
            sidecar.istio.io/inject: 'false'
          labels:
            # Carried over from the reference (its storage webhook keys off this
            # label); drop it if your cluster has no such webhook.
            file-mount: 'true'
        spec:
          hostNetwork: false
          containers:
            - name: pytorch
              image: "harbor.biomap-int.com/xinran_2026/kineager:affinity-v1"
              imagePullPolicy: IfNotPresent
              workingDir: "/workspace/kineager"
              command:
                - /bin/bash
                - -lc
              args:
                - |
                  set -euo pipefail
                  : "${MASTER_ADDR:?PyTorchJob did not inject MASTER_ADDR}"

                  # PET_* are injected by the training-operator. The NNODES
                  # fallback has to be Worker.replicas + 1 (see the env block):
                  # if neither is present we stop here instead of guessing.
                  export NNODES="${PET_NNODES:-${NNODES:?PyTorchJob did not inject PET_NNODES - set NNODES = Worker.replicas + 1}}"
                  export NODE_RANK="${PET_NODE_RANK:-${RANK:?PyTorchJob did not inject RANK}}"
                  export NPROC_PER_NODE="${NPROC_PER_NODE:-1}"
                  export MASTER_PORT="${MASTER_PORT:-29500}"
                  # Same NCCL names and defaults as the launcher and the
                  # xtrimofold3 reference. Every one is a ${VAR:-default}, so
                  # adding the name to the env block overrides it per run.
                  export NCCL_SOCKET_IFNAME="${NCCL_SOCKET_IFNAME:-eth0}"
                  export NCCL_IB_DISABLE="${NCCL_IB_DISABLE:-0}"
                  export NCCL_IB_GID_INDEX="${NCCL_IB_GID_INDEX:-5}"
                  export NCCL_DEBUG="${NCCL_DEBUG:-INFO}"
                  export NCCL_SOCKET_FAMILY="${NCCL_SOCKET_FAMILY:-AF_INET}"

                  # Declared once and called from both branches so the master and
                  # the workers can never run different hyperparameters.
                  #
                  # `exec` is an improvement on the reference, which called its
                  # bash_command as a plain child: the outer bash here is the
                  # container's PID 1, and a PID-namespace init ignores
                  # default-action signals, so a non-exec'd launcher would be
                  # SIGKILLed at the end of the grace period and torchrun's own
                  # SIGTERM handling would never run. With exec, the launcher's
                  # own exec makes torchrun PID 1 and preemption is handled.
                  run_trainer() {
                    exec bash bin/train/kineager_k8s.sh \
                      -epochs "${EPOCHS}" \
                      -batch_size "${BATCH_SIZE}" \
                      --split_mode group_pair \
                      --split_seed 42
                  }

                  # Only rank 0 appends to the shared log file; the other ranks
                  # stay on stdout/stderr. A single writer is what keeps the log
                  # readable (same pattern as the xtrimofold3 launcher).
                  node_rank="${NODE_RANK}"
                  if [ "${node_rank}" -eq 0 ]; then
                    run_trainer >> "${LOG_PATH:?set LOG_PATH to a file on storage all pods can write}" 2>&1
                  else
                    run_trainer
                  fi
              env:
                # ---- path profile ----------------------------------------------
                # Key into path_config.PATH_PROFILES chosen by
                # resolve_runtime_paths(). The launcher defaults it to "k8s";
                # this entry exists so the profile in use is visible and
                # changeable without reading bin/train/kineager_k8s.sh.
                - name: CATA_PROFILE
                  value: "k8s"
                # ---- write-path scoping: USER is required ----------------------
                # path_config.py expands ${USER} in the k8s profile's runs_dir,
                # weights_dir and train_data_dir. Nothing sets USER inside a pod,
                # and bin/train/kineager_k8s.sh refuses to start without this
                # value: the fallback is the SHARED
                # /pfs_beijing/kineager/kineager_runs, where two users' per-epoch
                # preds_epoch*/labels_epoch*.npy overwrite each other.
                - name: USER
                  value: "xinran_2026"
                # ---- inputs required by bin/train/kineager_k8s.sh --------------
                - name: TRAIN_CSV
                  value: "/pfs_beijing/xinran_2026/kineager_data/pdbbindv2020_affinity.csv"
                - name: KINEAGER_ESMC_PATH
                  value: "/pfs_beijing/xinran_2026/models/ESMC-6B2026.9.15"
                - name: KINEAGER_MOLFORMER_PATH
                  value: "/pfs_beijing/xinran_2026/models/molformer/models--ibm-research--MoLFormer-XL-both-10pct/snapshots/7b12d946c181a37f6012b9dc3b002275de070314"
                - name: LOG_PATH
                  value: "/pfs_beijing/xinran_2026/kineager_runs/kineager_affinity/rank0.log"
                # Only consulted when the operator does not inject PET_NNODES.
                - name: NNODES
                  value: "2"
                # ---- task and hyperparameters, passed through "$@" ------------
                # EPOCHS / BATCH_SIZE are the plan's runbook values; tune freely.
                # The launcher additionally honours LORA_LAYER_POLICY,
                # LORA_LAST_K and the NCCL_* / OMP_NUM_THREADS overrides listed
                # at the top of bin/train/kineager_k8s.sh - add them here if you
                # need to change them per run.
                - name: TASK
                  value: "affinity"
                - name: EPOCHS
                  value: "30"
                - name: BATCH_SIZE
                  value: "8"
                - name: ITERS_TO_ACCUMULATE
                  value: "1"
                - name: NUM_WORKERS
                  value: "8"
                - name: GRAD_CHECKPOINT_BACKBONE
                  value: "off"
              # A port named pytorchjob-port is how the training-operator derives
              # MASTER_PORT for the rendezvous; keep it in sync with MASTER_PORT.
              ports:
                - name: pytorchjob-port
                  containerPort: 11451
                  protocol: TCP
              securityContext:
                # RDMA / NCCL needs locked memory; both come from the reference.
                privileged: true
                capabilities:
                  add:
                    - IPC_LOCK
              resources:
                requests:
                  nvidia.com/gpu: 1
                  # The resource KEY is `rdma/hca` on the reference cluster (the
                  # reference asks for "501"); only the COUNT belongs in the value.
                  # A wrong key stays invisible until the pod sits Pending.
                  rdma/hca: 1
                  cpu: 16
                  memory: 200Gi
                limits:
                  nvidia.com/gpu: 1
                  # Keep identical to requests (Guaranteed QoS), as in the reference.
                  rdma/hca: 1
                  cpu: 16
                  memory: 200Gi
              volumeMounts:
                - name: shm-volume
                  mountPath: /dev/shm
          nodeSelector:
            # Node labels copied from the xtrimofold3 reference; replace the
            # values if your A100 / RoCE nodes are labelled differently.
            gpu.device: a100
            rdma: roce2
          tolerations:
            # Taints of the GPU partitions used by the reference run.
            - effect: NoSchedule
              key: role
              operator: Equal
              value: NBTopic
            - effect: NoSchedule
              key: role
              operator: Equal
              value: 006_mix
          volumes:
            - name: shm-volume
              emptyDir:
                medium: Memory
                sizeLimit: "64Gi"
    Worker:
      replicas: 1
      restartPolicy: OnFailure
      template: *pytorch-template
